appId: com.ftlite.foundation
productName: FTLite
directories:
  output: dist
files:
  # Only the build's three entry folders: evidence written under out/ by the smokes is never packaged (H-2b).
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - '!**/.env*'
  - '!**/.dev.vars*'
  - '!**/test-results/**'
  - '!**/.superpowers/**'
  - '!node_modules/**/src/**'
  - '!**/tests/**'
  - '!**/__tests__/**'
  - '!**/scripts/**'
  - '!**/*.map'
extraResources:
  - from: public/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
win:
  target: nsis
nsis:
  oneClick: true
  artifactName: ftlite-setup-${version}.exe
